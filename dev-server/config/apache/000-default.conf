# Runtime vhost bind-mounted over sites-available/000-default.conf on DEV.
# DocumentRoot = /var/www/html/web (aligned with image vhost + APACHE_DOCUMENT_ROOT).
<VirtualHost *:80>
    DocumentRoot /var/www/html/web
    <Directory /var/www/html/web>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
