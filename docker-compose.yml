# Brewsbook local/dev topology
# Browser → Caddy → web (Next stub) / keycloak / api (PHP stub) → mysql
# Staging/prod will use separate compose overlays; this file is local-only.

name: brewsbook

networks:
  brewsbook:
    name: brewsbook
    driver: bridge

volumes:
  mysql_data:
  keycloak_data:

services:
  mysql:
    image: mysql:8.0
    container_name: brewsbook-mysql
    restart: unless-stopped
    networks: [brewsbook]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brewsbook}
      MYSQL_USER: ${MYSQL_USER:-brewsbook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: brewsbook-keycloak
    restart: unless-stopped
    networks: [brewsbook]
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Local only: embedded H2 via start-dev. Staging/prod → production mode + external DB.
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-brewsbook.json:/opt/keycloak/data/import/realm-brewsbook.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 serves /health/ready on the management port (9000), not 8080.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200\\|UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: brewsbook-api
    restart: unless-stopped
    networks: [brewsbook]
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-brewsbook}
      DB_USERNAME: ${MYSQL_USER:-brewsbook}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/brewsbook}
      OIDC_API_CLIENT_ID: ${OIDC_API_CLIENT_ID:-brewsbook-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/brewsbook/protocol/openid-connect/certs}
      OIDC_ALLOWED_AZP: ${OIDC_ALLOWED_AZP:-brewsbook-nextjs,brewsbook-api}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-brewsbook}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://localhost}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      CI_ENVIRONMENT: production
    ports:
      - "${API_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-http://localhost:8081/realms/brewsbook}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-brewsbook-nextjs}
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
    container_name: brewsbook-web
    restart: unless-stopped
    networks: [brewsbook]
    environment:
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
      NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-http://localhost:8081/realms/brewsbook}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-brewsbook-nextjs}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: brewsbook-caddy
    restart: unless-stopped
    networks: [brewsbook]
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - keycloak
